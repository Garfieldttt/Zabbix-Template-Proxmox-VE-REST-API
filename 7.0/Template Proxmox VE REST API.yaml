            - uuid: 58c148d323b24f7a824f2934d219d16c
              name: 'Memory usage of  {#VMID}'
              type: DEPENDENT
              key: 'lxc.memusage[{#VMID}]'
              delay: '0'
              units: Bytes
              description: 'Memory usage on Proxmox host for LXC {#VMID}'
              preprocessing:
