        - uuid: 8cbc645bf73d4654afa40ff9245ac67c
          name: 'PVE tasks raw'
          type: HTTP_AGENT
          key: pve.tasks.raw
          history: '0'
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Zabbix JavaScript-Preprocessing für Gruppierung und Typ-Erfassung
                  try {
                      // 1. Parse input
                      var obj = (typeof value === 'string') ? JSON.parse(value) : value;
                  
                      // 2. Daten-Array ermitteln
                      var dataArr = [];
                      if (obj.data && Array.isArray(obj.data)) {
                          dataArr = obj.data;
                      } else if (obj.body && Array.isArray(obj.body.data)) {
                          dataArr = obj.body.data;
                      }
                      if (dataArr.length === 0) {
                          return JSON.stringify({ total: 0, data: [] });
                      }
                  
                      // Hilfsfunktionen für Zeitfelder
                      function getStart(e) {
                          return (typeof e.starttime === 'number')
                              ? e.starttime
                              : ((typeof e.pstart === 'number') ? e.pstart : undefined);
                      }
                      function getEnd(e) {
                          return (typeof e.endtime === 'number') ? e.endtime : undefined;
                      }
                  
                      // 3. Fallback für fehlende IDs
                      dataArr.forEach(function(e) {
                          if (e.id === undefined || e.id === null || e.id === '') {
                              e.id = (e.type || 'unknown');
                          }
                      });
                  
                      // 4. Ungültige Einträge ohne Startzeit herausfiltern
                      dataArr = dataArr.filter(function(e) {
                          return getStart(e) !== undefined;
                      });
                      if (dataArr.length === 0) {
                          return JSON.stringify({ total: 0, data: [] });
                      }
                  
                      // 5. Sortieren nach Startzeit
                      dataArr.sort(function(a, b) {
                          return getStart(a) - getStart(b);
                      });
                  
                      // 6. Gruppieren und Metadaten sammeln (inkl. Typ des letzten Laufs)
                      var groups = {};
                      dataArr.forEach(function(e) {
                          var key    = e.id;
                          var st     = getStart(e);
                          var et     = getEnd(e);
                          var hasEnd = et !== undefined;
                  
                          if (!groups[key]) {
                              // Initialisierung pro ID
                              groups[key] = {
                                  id:        key,
                                  grpId:     key,
                                  node:      e.node,
                                  firstRun:  st,
                                  lastRun:   st,
                                  lastEnd:   hasEnd ? et : null,
                                  lastType:  e.type
                              };
                          } else {
                              var g = groups[key];
                              // frühester Start
                              if (st < g.firstRun) {
                                  g.firstRun = st;
                              }
                              // spätester Start + Typ
                              if (st > g.lastRun) {
                                  g.lastRun  = st;
                                  g.lastType = e.type;
                              }
                              // spätester Endzeitpunkt
                              if (hasEnd && (g.lastEnd === null || et > g.lastEnd)) {
                                  g.lastEnd = et;
                              }
                          }
                      });
                  
                      // 7. Sortierung der Gruppenschlüssel
                      var keys = Object.keys(groups);
                      keys.sort(function(a, b) {
                          var na = parseInt(a, 10), nb = parseInt(b, 10);
                          var aNum = !isNaN(na), bNum = !isNaN(nb);
                          if (aNum && bNum)     return na - nb;
                          if (aNum && !bNum)    return -1;
                          if (!aNum && bNum)    return 1;
                          return a < b ? -1 : 1;
                      });
                  
                      // 8. Ergebnis-Array aufbauen mit id, grpId, node, starttime, stoptime und type
                      var resultData = keys.map(function(key) {
                          var g = groups[key];
                          return {
                              id:        g.id,
                              grpId:     g.grpId,
                              node:      g.node,
                              starttime: g.firstRun,
                              stoptime:  g.lastEnd,
                              type:      g.lastType
                          };
                      });
                  
                      // 9. JSON zurückgeben
                      return JSON.stringify({ total: resultData.length, data: resultData });
                  
                  } catch (err) {
                      return JSON.stringify({ total: 0, data: [] });
                  }
          timeout: 20s
          url: 'https://{$PVE_IP}:{$PVE_PORT}/api2/json/nodes/{$PVE_NODE}/tasks'
          headers:
            - name: Authorization
              value: 'PVEAPIToken={$PVE_API_USER}!{$PVE_API_TOKEN_ID}={$PVE_API_TOKEN}'
            - name: Accept
              value: application/json
          output_format: JSON
