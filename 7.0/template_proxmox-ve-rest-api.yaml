            - uuid: 1e0e681ed15e434688d065d65fb7e5bf
              expression: 'avg(/pfSense by SNMP/udp.in.errors.rate,5m)>10'
              name: 'pfSense: Elevated UDP input error rate'
              opdata: 'Rate: {ITEM.LASTVALUE1}/s'
              priority: WARNING
              description: 'UDP input error rate is elevated. Packets are being dropped.'
              tags:
                - tag: scope
