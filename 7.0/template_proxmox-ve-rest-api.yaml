        - uuid: f3bcc18955ca44f6adac32eafb7e9262
          name: 'Memory available'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.4.6.0]'
          key: vm.memory.available
          delay: '60'
          history: 1w
          units: B
          description: 'memAvailReal — available real memory in KB, converted to bytes. Includes free memory that can be used immediately.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 2515f87854374ac2a156095b69c80943
          name: 'Memory buffers'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.4.14.0]'
          key: vm.memory.buffers
          delay: '60'
          history: 1w
          units: B
          description: 'memBuffer — buffer memory in KB, converted to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: a08b42a544df408387236a2f03df4367
          name: 'Memory cached'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.4.15.0]'
          key: vm.memory.cached
          delay: '60'
          history: 1w
          units: B
          description: 'memCached — cached memory in KB, converted to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 45924e7dd84e41bea8124f886e115997
          name: 'Memory shared'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.4.13.0]'
          key: vm.memory.shared
          delay: '60'
          history: 1w
          units: B
          description: 'memShared (UCD-SNMP) — shared memory in KB, converted to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 90ac93d6164e45e08fb63ab4efb407b5
          name: 'Swap free'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.4.4.0]'
          key: vm.memory.swap.free
          delay: '60'
          history: 1w
          units: B
          description: 'memAvailSwap (UCD-SNMP) — available swap space in KB, converted to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 99ed881f74674787998c1245fbdf60ed
          name: 'Swap total'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.4.3.0]'
          key: vm.memory.swap.total
          delay: 1h
          history: 1w
          units: B
          description: 'memTotalSwap (UCD-SNMP) — total configured swap space in KB, converted to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: memory
        - uuid: 3a42a26b2b2843979499b16d003ef6d7
          name: 'Swap utilization'
          type: CALCULATED
          key: vm.memory.swap.util
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          params: '(last(/{HOST.HOST}/vm.memory.swap.total) - last(/{HOST.HOST}/vm.memory.swap.free)) / last(/{HOST.HOST}/vm.memory.swap.total) * 100'
          description: 'Swap space utilization calculated from memTotalSwap and memAvailSwap.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 3e5cbf5a1e6c42b490e2bf6b2f161725
              expression: 'min(/pfSense by SNMP/vm.memory.swap.util,5m)>{$MEMORY.SWAP.WARN}'
              name: 'pfSense: High swap utilization'
              opdata: 'Swap used: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Swap utilization has been above {$MEMORY.SWAP.WARN}% for 5 minutes. System is under memory pressure.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 14e1d1d55d964a61af59a483df0b4c21
          name: 'Total memory'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.2.2.0]'
          key: vm.memory.total
          delay: 1h
          history: 1w
          units: B
          description: 'hrMemorySize — total installed RAM in KB, converted to bytes.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: memory
        - uuid: 127ff0190e87462089a3f05c9995c1db
          name: 'Memory utilization'
          type: CALCULATED
          key: vm.memory.util
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          params: '(last(/{HOST.HOST}/vm.memory.total) - last(/{HOST.HOST}/vm.memory.available)) / last(/{HOST.HOST}/vm.memory.total) * 100'
          description: 'Memory utilization calculated from UCD-SNMP memTotalReal and memAvailReal.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: f02782e78037493f8a3ceee9a8ea1800
              expression: 'min(/pfSense by SNMP/vm.memory.util,5m)>{$MEMORY.UTIL.MAX}'
              name: 'pfSense: High memory utilization'
              priority: WARNING
              description: 'Memory utilization has been above {$MEMORY.UTIL.MAX}% for 5 minutes.'
              tags:
                - tag: scope
                  value: capacity
      discovery_rules:
        - uuid: 3a6fcbbc57db472b99c3acb2d18d8d1f
          name: 'CPU cores discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.2.1.25.3.3.1.2]'
          key: cpu.discovery
          delay: 1h
          description: 'Discovers CPU cores via hrProcessorLoad table.'
          item_prototypes:
            - uuid: 8c8e799838524933855d858045c16c8b
              name: 'CPU core {#SNMPINDEX}: Utilization'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.3.3.1.2.{#SNMPINDEX}]'
              key: 'system.cpu.util[{#SNMPINDEX}]'
              delay: '60'
              history: 1w
              units: '%'
              description: 'hrProcessorLoad — CPU utilization for this core (%).'
              tags:
                - tag: component
                  value: cpu
                - tag: core
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: 3a75d7215e3c4d1c8ecb8d50852f1f08
                  expression: 'avg(/pfSense by SNMP/system.cpu.util[{#SNMPINDEX}],5m)>{$CPU.UTIL.CRIT} and {$ENABLE_CPU_CORE_ALERT}=1'
                  name: 'CPU core {#SNMPINDEX}: High CPU utilization'
                  opdata: 'Current: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: |
                    CPU utilization on core {#SNMPINDEX} exceeds {$CPU.UTIL.CRIT}% for 5 minutes.
                    To disable this trigger, set {$ENABLE_CPU_CORE_ALERT} to 0
                  tags:
                    - tag: scope
                      value: performance
          graph_prototypes:
            - uuid: d165c64ebdd14327964402bb8f63fc8f
              name: 'CPU core {#SNMPINDEX}: Utilization'
              graph_items:
                - color: FF5722
                  item:
                    host: 'pfSense by SNMP'
                    key: 'system.cpu.util[{#SNMPINDEX}]'
        - uuid: c09a49027e4d4f04a7e4e5a5f91122cf
          name: 'Disk I/O discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.2021.13.15.1.1.2]'
          key: disk.io.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SNMPVALUE}'
                value: '{$DISK.IO.DEVICE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          description: 'Discovers physical disk devices via UCD-SNMP diskIOTable. Passthrough devices (pass*) are excluded.'
          item_prototypes:
            - uuid: 1168ee8506fd419e9adaff9b20963344
              name: 'Disk {#SNMPVALUE}: Read throughput'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.2021.13.15.1.1.12.{#SNMPINDEX}]'
              key: 'disk.io.read[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: Bps
              description: 'diskIONRead — bytes read per second from this disk device (Counter64).'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: storage
            - uuid: c4c972b0cb0d4199be4e1875cbdb5509
              name: 'Disk {#SNMPVALUE}: Write throughput'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.2021.13.15.1.1.13.{#SNMPINDEX}]'
              key: 'disk.io.write[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: Bps
              description: 'diskIONWritten — bytes written per second to this disk device (Counter64).'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: storage
          graph_prototypes:
            - uuid: 7fa538fe3d554c60bbb80a09b715dd57
              name: 'Disk {#SNMPVALUE}: I/O throughput'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'pfSense by SNMP'
                    key: 'disk.io.read[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: E53935
                  item:
                    host: 'pfSense by SNMP'
                    key: 'disk.io.write[{#SNMPVALUE}]'
        - uuid: 8c344831467241378fb53757dd10f5b1
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.2.1.2.2.1.2]'
          key: net.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SNMPVALUE}'
                value: '{$NET.IF.IFNAME.MATCHES}'
                formulaid: A
              - macro: '{#SNMPVALUE}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Discovers network interfaces via IF-MIB ifDescr walk. Excludes pflog, pfsync, enc, lo by default.'
          item_prototypes:
            - uuid: 77ad791b3a0449eea04f14fcabb3cf6d
              name: 'Interface {#SNMPVALUE}: Admin status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]'
              key: 'net.if.admin.status[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              description: 'ifAdminStatus — 1=up, 2=down, 3=testing.'
              valuemap:
                name: 'IF-MIB::ifAdminStatus'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: 0e2ba3ea993e46daa743ceb7a54acdcb
              name: 'Interface {#SNMPVALUE}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]'
              key: 'net.if.in.errors[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: eps
              description: 'ifInErrors — inbound packet errors per second.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
              trigger_prototypes:
                - uuid: 0a84e0912907493bbb081666b53f54d5
                  expression: 'min(/pfSense by SNMP/net.if.in.errors[{#SNMPVALUE}],5m)>{$IF.ERRORS.WARN} and {$ENABLE_IF_ERROR_ALERT:"{#SNMPVALUE}"}=1'
                  name: 'Interface {#SNMPVALUE}: High inbound error rate'
                  opdata: 'Errors/s: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'To disable this trigger, set {$ENABLE_IF_UTIL_ALERT:"{#SNMPVALUE}"} to 0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 0916206023f54d30abcd81ea8a19a2da
              name: 'Interface {#SNMPVALUE}: Inbound traffic'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]'
              key: 'net.if.in[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: bps
              description: 'ifHCInOctets — inbound octets (Counter64), converted to bits per second. Note: tun/virtual interfaces (tailscale, wireguard, gif, gre) always report 0 due to a FreeBSD bsnmpd limitation — the tun driver does not populate IF-MIB octet counters.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: 7df739182be740faa23d6290f7e668dc
              name: 'Interface {#SNMPVALUE}: Operational status'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]'
              key: 'net.if.oper.status[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              description: 'ifOperStatus — 1=up, 2=down, 3=testing, 4=unknown, 5=dormant, 6=notPresent, 7=lowerLayerDown.'
              valuemap:
                name: 'IF-MIB::ifOperStatus'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: 63cac750415d4e8f9ba6109ff2da9f6b
              name: 'Interface {#SNMPVALUE}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]'
              key: 'net.if.out.errors[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: eps
              description: 'ifOutErrors — outbound packet errors per second.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
              trigger_prototypes:
                - uuid: 87c7e5ad8e9c460d9f1465030772438c
                  expression: 'min(/pfSense by SNMP/net.if.out.errors[{#SNMPVALUE}],5m)>{$IF.ERRORS.WARN} and {$ENABLE_IF_ERROR_ALERT:"{#SNMPVALUE}"}=1'
                  name: 'Interface {#SNMPVALUE}: High outbound error rate'
                  opdata: 'Errors/s: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'To disable this trigger, set {$ENABLE_IF_ERROR_ALERT:"{#SNMPVALUE}"} to 0'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 73c02a87e8664db289c1b810beceed6f
              name: 'Interface {#SNMPVALUE}: Outbound traffic'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]'
              key: 'net.if.out[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: bps
              description: 'ifHCOutOctets — outbound octets (Counter64), converted to bits per second. Note: tun/virtual interfaces (tailscale, wireguard, gif, gre) always report 0 due to a FreeBSD bsnmpd limitation — the tun driver does not populate IF-MIB octet counters.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: 830b09bf60644aea90112080f342ad3f
              name: 'Interface {#SNMPVALUE}: Speed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]'
              key: 'net.if.speed[{#SNMPVALUE}]'
              delay: 5m
              history: 1w
              units: bps
              description: 'ifHighSpeed — interface speed in Mbps, converted to bps.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: 2cce1db27cc94521a5f528e4a9213047
              name: 'Interface {#SNMPVALUE}: Traffic monitoring'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}]'
              key: 'net.if.traffic.support[{#SNMPVALUE}]'
              delay: 1h
              history: 1w
              value_type: CHAR
              trends: '0'
              description: 'Indicates whether IF-MIB octet counters are functional for this interface. tun/virtual interface types (ifType 131=tunnel, 53=propVirtual) always report 0 bps on FreeBSD because the tun driver does not populate ifHCIn/OutOctets in bsnmpd.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var t = parseInt(value);
                      if (t === 131) return "Not supported — tunnel interface (gif/gre/ipsec/wireguard), FreeBSD tun driver does not expose octet counters via IF-MIB";
                      if (t === 53)  return "Not supported — propVirtual interface (vlan/lagg), FreeBSD tun driver does not expose octet counters via IF-MIB";
                      if (t === 24)  return "Not supported — loopback interface";
                      return "Supported";
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#SNMPVALUE}'
          trigger_prototypes:
            - uuid: ff634a66c51d423b90d26cce291f8bfe
              expression: 'avg(/pfSense by SNMP/net.if.in[{#SNMPVALUE}],15m)/last(/pfSense by SNMP/net.if.speed[{#SNMPVALUE}])*100>{$IF.UTIL.MAX} and last(/pfSense by SNMP/net.if.speed[{#SNMPVALUE}])>0 and {$ENABLE_IF_UTIL_ALERT:"{#SNMPVALUE}"}=1'
              name: 'Interface {#SNMPVALUE}: High inbound utilization'
              opdata: 'In: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                Inbound bandwidth utilization on {#SNMPVALUE} exceeds {$IF.UTIL.MAX}% of line speed for 15 minutes.
                To disable this trigger, set {$ENABLE_IF_UTIL_ALERT:"{#SNMPVALUE}"} to 0
              tags:
                - tag: scope
                  value: performance
            - uuid: 9029883007c64a70a608eade949e099a
              expression: 'avg(/pfSense by SNMP/net.if.out[{#SNMPVALUE}],15m)/last(/pfSense by SNMP/net.if.speed[{#SNMPVALUE}])*100>{$IF.UTIL.MAX} and last(/pfSense by SNMP/net.if.speed[{#SNMPVALUE}])>0 and {$ENABLE_IF_UTIL_ALERT:"{#SNMPVALUE}"}=1'
              name: 'Interface {#SNMPVALUE}: High outbound utilization'
              opdata: 'Out: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                Outbound bandwidth utilization on {#SNMPVALUE} exceeds {$IF.UTIL.MAX}% of line speed for 15 minutes.
                To disable this trigger, set {$ENABLE_LINK_DOWN_ALERT:"{#SNMPVALUE}"} to 0
              tags:
                - tag: scope
                  value: performance
            - uuid: 64a292bb55e3442183c5abca6ce95726
              expression: 'last(/pfSense by SNMP/net.if.oper.status[{#SNMPVALUE}])<>1 and last(/pfSense by SNMP/net.if.admin.status[{#SNMPVALUE}])=1 and {$ENABLE_LINK_DOWN_ALERT:"{#SNMPVALUE}"}=1'
              name: 'Interface {#SNMPVALUE}: Link down'
              priority: AVERAGE
              description: |
                Interface is administratively up but operationally down.
                To disable this trigger, set {$ENABLE_LINK_DOWN_ALERT:"{#SNMPVALUE}"} to 0.
              tags:
                - tag: scope
                  value: availability
          graph_prototypes:
            - uuid: a9bedf796f94412ba9a48d2a536708e2
              name: 'Interface {#SNMPVALUE}: Traffic'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'pfSense by SNMP'
                    key: 'net.if.in[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: F63100
                  item:
                    host: 'pfSense by SNMP'
                    key: 'net.if.out[{#SNMPVALUE}]'
        - uuid: cc64e70771b04f31939e549ef5552268
          name: 'pf interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.12325.1.200.1.8.2.1.2]'
          key: pf.if.discovery
          delay: 1h
          description: |
            Discovers pf-tracked interfaces via pfInterfacesIfDescr.
            Shows per-interface passed and blocked byte/packet statistics.
            Requires snmp_pf.so module.
          item_prototypes:
            - uuid: 6a89a4f9409d4386b9fc55b8e43bb49d
              name: 'pf Interface {#SNMPVALUE}: IPv4 inbound bytes blocked'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.8.2.1.8.{#SNMPINDEX}]'
              key: 'pf.if.ip4.in.block.bytes[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: bps
              description: 'pfInterfacesIf4BytesInBlock — IPv4 bytes per second blocked inbound.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: firewall
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: 07dd920cfda14ea289c549c673bef27f
              name: 'pf Interface {#SNMPVALUE}: IPv4 inbound packets blocked'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.8.2.1.12.{#SNMPINDEX}]'
              key: 'pf.if.ip4.in.block.pkts[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: pps
              description: 'pfInterfacesIf4PktsInBlock — IPv4 packets per second blocked inbound.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
                - tag: interface
                  value: '{#SNMPVALUE}'
              trigger_prototypes:
                - uuid: 2b51f2c552804faf8bb7fc9746005c0e
                  expression: 'avg(/pfSense by SNMP/pf.if.ip4.in.block.pkts[{#SNMPVALUE}],5m)>{$PF.IF.BLOCK.WARN} and {$ENABLE_PF_BLOCK_ALERT:"{#SNMPVALUE}"}=1'
                  name: 'pf Interface {#SNMPVALUE}: High inbound block rate'
                  opdata: 'Blocked/s: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    pf is blocking more than {$PF.IF.BLOCK.WARN} packets/s inbound on {#SNMPVALUE}.
                    To disable this trigger, set {$ENABLE_PF_BLOCK_ALERT:"{#SNMPVALUE}"} to 0
                  tags:
                    - tag: scope
                      value: security
            - uuid: 0c38743451c04596ae778d07015aa2d6
              name: 'pf Interface {#SNMPVALUE}: IPv4 inbound bytes passed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.8.2.1.7.{#SNMPINDEX}]'
              key: 'pf.if.ip4.in.pass.bytes[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: bps
              description: 'pfInterfacesIf4BytesInPass — IPv4 bytes per second passed inbound.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: firewall
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: 5476134e8b8540a99914793c4e40b09f
              name: 'pf Interface {#SNMPVALUE}: IPv4 outbound bytes blocked'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.8.2.1.10.{#SNMPINDEX}]'
              key: 'pf.if.ip4.out.block.bytes[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: bps
              description: 'pfInterfacesIf4BytesOutBlock — IPv4 bytes per second blocked outbound.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: firewall
                - tag: interface
                  value: '{#SNMPVALUE}'
            - uuid: ab954981fccd47088ec19a7f2c15e442
              name: 'pf Interface {#SNMPVALUE}: IPv4 outbound packets blocked'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.8.2.1.14.{#SNMPINDEX}]'
              key: 'pf.if.ip4.out.block.pkts[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: pps
              description: 'pfInterfacesIf4PktsOutBlock — IPv4 packets per second blocked outbound.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
                - tag: interface
                  value: '{#SNMPVALUE}'
              trigger_prototypes:
                - uuid: 0495a3875fe1425284d738fa6906dd20
                  expression: 'avg(/pfSense by SNMP/pf.if.ip4.out.block.pkts[{#SNMPVALUE}],5m)>{$PF.IF.BLOCK.WARN} and {$ENABLE_PF_BLOCK_ALERT:"{#SNMPVALUE}"}=1'
                  name: 'pf Interface {#SNMPVALUE}: High outbound block rate'
                  opdata: 'Blocked/s: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: |
                    pf is blocking more than {$PF.IF.BLOCK.WARN} packets/s outbound on {#SNMPVALUE}.
                    To disable this trigger, set {$ENABLE_PF_BLOCK_ALERT:"{#SNMPVALUE}"} to 0
                  tags:
                    - tag: scope
                      value: security
            - uuid: 5de92b1ef37d4f7ca4facfc431e60a6e
              name: 'pf Interface {#SNMPVALUE}: IPv4 outbound bytes passed'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.8.2.1.9.{#SNMPINDEX}]'
              key: 'pf.if.ip4.out.pass.bytes[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: bps
              description: 'pfInterfacesIf4BytesOutPass — IPv4 bytes per second passed outbound.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: firewall
                - tag: interface
                  value: '{#SNMPVALUE}'
          graph_prototypes:
            - uuid: 705ec0acdab24da791bec5971baa7ce7
              name: 'pf Interface {#SNMPVALUE}: Passed vs Blocked (inbound)'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.if.ip4.in.pass.bytes[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: E53935
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.if.ip4.in.block.bytes[{#SNMPVALUE}]'
            - uuid: 650a1bf08978439bbf2a140cb265ab8c
              name: 'pf Interface {#SNMPVALUE}: Passed vs Blocked (outbound)'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.if.ip4.out.pass.bytes[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: E53935
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.if.ip4.out.block.bytes[{#SNMPVALUE}]'
        - uuid: 62f54fbf15c2402195dee34ddc97b6ad
          name: 'pf rules discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.12325.1.200.1.11.2.1.2]'
          key: pf.label.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SNMPVALUE}'
                value: ^.+$
                formulaid: A
          description: 'Discovers pf labeled rules (pfLabelsLblName). Only rules with a non-empty label are discovered. Note: multiple rules can share the same label (e.g. IPv4+IPv6 variants) — items are keyed by index.'
          item_prototypes:
            - uuid: 726299d78a6346839a9b6f30a5b15b97
              name: 'pf Rule [{#SNMPINDEX}] {#SNMPVALUE}: Inbound bytes'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.11.2.1.4.{#SNMPINDEX}]'
              key: 'pf.label.bytes.in[{#SNMPINDEX}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: Bps
              description: 'pfLabelsLblBytesIn — inbound bytes per second matched by this pf rule.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
            - uuid: 5a1cf3efc7734f8a85d969bc9e16d144
              name: 'pf Rule [{#SNMPINDEX}] {#SNMPVALUE}: Outbound bytes'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.11.2.1.5.{#SNMPINDEX}]'
              key: 'pf.label.bytes.out[{#SNMPINDEX}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: Bps
              description: 'pfLabelsLblBytesOut — outbound bytes per second matched by this pf rule.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
            - uuid: a531cb6e480640abba3feb930f56ae2d
              name: 'pf Rule [{#SNMPINDEX}] {#SNMPVALUE}: Inbound packets'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.11.2.1.6.{#SNMPINDEX}]'
              key: 'pf.label.pkts.in[{#SNMPINDEX}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: pps
              description: 'pfLabelsLblPktsIn — inbound packets per second matched by this pf rule.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
            - uuid: f8c647aaee2647f493f397d9929d36e8
              name: 'pf Rule [{#SNMPINDEX}] {#SNMPVALUE}: Outbound packets'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.11.2.1.7.{#SNMPINDEX}]'
              key: 'pf.label.pkts.out[{#SNMPINDEX}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: pps
              description: 'pfLabelsLblPktsOut — outbound packets per second matched by this pf rule.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
          graph_prototypes:
            - uuid: 317616f0d2d24cfbb0718f0531b2053e
              name: 'pf Rule [{#SNMPINDEX}] {#SNMPVALUE}: Traffic'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.label.bytes.in[{#SNMPINDEX}]'
                - sortorder: '1'
                  color: E53935
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.label.bytes.out[{#SNMPINDEX}]'
        - uuid: b83951f65ad4459ab05ad1248b494a34
          name: 'pf tables discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.4.1.12325.1.200.1.9.2.1.2]'
          key: pf.table.discovery
          delay: 1h
          description: 'Discovers pf tables (pfTablesTblName) — blocklists such as sshguard, snort2c, bogons, virusprot and network alias tables.'
          item_prototypes:
            - uuid: 6bc87a75f5864123bcb368fecb4be18e
              name: 'pf Table {#SNMPVALUE}: Entry count'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.9.2.1.3.{#SNMPINDEX}]'
              key: 'pf.table.count[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              units: entries
              description: 'pfTablesTblCount — current number of IP addresses/networks in this pf table. For sshguard/snort2c/virusprot: growing count indicates active blocking.'
              tags:
                - tag: component
                  value: firewall
              trigger_prototypes:
                - uuid: db2736affce94cdc9930a610f75d095a
                  expression: 'last(/pfSense by SNMP/pf.table.count[{#SNMPVALUE}])>{$PF.TABLE.COUNT.WARN} and {$ENABLE_PF_TABLE_ALERT:"{#SNMPVALUE}"}=1'
                  name: 'pf Table {#SNMPVALUE}: High entry count (>{$PF.TABLE.COUNT.WARN})'
                  priority: WARNING
                  description: |
                    pf table {#SNMPVALUE} contains more than {$PF.TABLE.COUNT.WARN} entries. For dynamic blocklists (sshguard, snort2c, virusprot) this may indicate an ongoing attack.
                    To disable this trigger, set {$ENABLE_PF_TABLE_ALERT:"{#SNMPVALUE}"} to 0
                  tags:
                    - tag: scope
                      value: security
            - uuid: b5c42dad04b94085be205665423cc935
              name: 'pf Table {#SNMPVALUE}: Match rate'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.9.2.1.7.{#SNMPINDEX}]'
              key: 'pf.table.eval.match.rate[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: pps
              description: 'pfTablesTblEvalMatch — packets per second that matched an entry in this table.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
            - uuid: d4722bcd61b64820aeb66913e337888e
              name: 'pf Table {#SNMPVALUE}: No-match rate'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.9.2.1.8.{#SNMPINDEX}]'
              key: 'pf.table.eval.nomatch.rate[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: pps
              description: 'pfTablesTblEvalNoMatch — packets per second evaluated against this table but not found in it.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              tags:
                - tag: component
                  value: firewall
          graph_prototypes:
            - uuid: 52dcd4804a634be3afbcdfbab06a7636
              name: 'pf Table {#SNMPVALUE}: Match rate'
              graph_items:
                - color: E53935
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.table.eval.match.rate[{#SNMPVALUE}]'
                - sortorder: '1'
                  color: 1A7C11
                  item:
                    host: 'pfSense by SNMP'
                    key: 'pf.table.eval.nomatch.rate[{#SNMPVALUE}]'
        - uuid: 1442e3ceaf2f41e69b5a74bbbc22fdb1
          name: 'Storage discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},1.3.6.1.2.1.25.2.3.1.3]'
          key: storage.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SNMPVALUE}'
                value: '^(Physical memory|Swap space|/.*)$'
                formulaid: A
          description: 'Discovers storage areas: RAM, swap and mounted filesystems.'
          item_prototypes:
            - uuid: f3b87e092acd4e0aa52e4ae0d9e691a1
              name: 'Storage {#SNMPVALUE}: Allocation units'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.2.3.1.4.{#SNMPINDEX}]'
              key: 'storage.alloc.units[{#SNMPVALUE}]'
              delay: 1h
              history: 1w
              description: 'hrStorageAllocationUnits — block size in bytes.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: storage
            - uuid: 08dbb075350f4192b46fabdba0697671
              name: 'Storage {#SNMPVALUE}: Total size'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.2.3.1.5.{#SNMPINDEX}]'
              key: 'storage.total[{#SNMPVALUE}]'
              delay: 1h
              history: 1w
              description: 'hrStorageSize — total size in allocation units.'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              tags:
                - tag: component
                  value: storage
            - uuid: 2814452742504e47af1b612bdfa9fff1
              name: 'Storage {#SNMPVALUE}: Used'
              type: SNMP_AGENT
              snmp_oid: 'get[1.3.6.1.2.1.25.2.3.1.6.{#SNMPINDEX}]'
              key: 'storage.used[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              description: 'hrStorageUsed — used allocation units.'
              tags:
                - tag: component
                  value: storage
            - uuid: f3b2b56befb745efb48a5bb03b0a317b
              name: 'Storage {#SNMPVALUE}: Utilization'
              type: CALCULATED
              key: 'storage.util[{#SNMPVALUE}]'
              delay: '60'
              history: 1w
              value_type: FLOAT
              units: '%'
              params: 'last(/{HOST.HOST}/storage.used[{#SNMPVALUE}]) / last(/{HOST.HOST}/storage.total[{#SNMPVALUE}]) * 100'
              description: 'Calculated storage utilization percentage.'
              tags:
                - tag: component
                  value: storage
              trigger_prototypes:
                - uuid: f3b0cc29792e495887290da04bd197ee
                  expression: 'last(/pfSense by SNMP/storage.util[{#SNMPVALUE}])>{$STORAGE.UTIL.CRIT} and {$ENABLE_STORAGE_ALERT}=1'
                  name: 'Storage {#SNMPVALUE}: Critically full'
                  opdata: 'Used: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'To disable this trigger, set {$ENABLE_STORAGE_ALERT} to 0'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: 26586ef06f734e61999c239fc5fc0dd3
                  expression: 'last(/pfSense by SNMP/storage.util[{#SNMPVALUE}])>{$STORAGE.UTIL.WARN} and {$ENABLE_STORAGE_ALERT}=1'
                  name: 'Storage {#SNMPVALUE}: High utilization'
                  opdata: 'Used: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'To disable this trigger, set {$ENABLE_STORAGE_ALERT} to 0'
                  dependencies:
                    - name: 'Storage {#SNMPVALUE}: Critically full'
                      expression: 'last(/pfSense by SNMP/storage.util[{#SNMPVALUE}])>{$STORAGE.UTIL.CRIT} and {$ENABLE_STORAGE_ALERT}=1'
                  tags:
                    - tag: scope
                      value: capacity
          graph_prototypes:
            - uuid: 5ca53ee07c724803bcd7412af188048b
              name: 'Storage {#SNMPVALUE}: Utilization'
              graph_items:
                - color: 42A5F5
                  item:
                    host: 'pfSense by SNMP'
                    key: 'storage.util[{#SNMPVALUE}]'
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'Critical CPU utilization threshold (%)'
        - macro: '{$CPU.UTIL.WARN}'
          value: '80'
          description: 'Warning threshold for CPU utilization (%)'
        - macro: '{$DISK.IO.DEVICE.NOT_MATCHES}'
          value: '^pass[0-9]'
          description: 'Regex: exclude passthrough devices from disk I/O discovery'
        - macro: '{$ENABLE_CPU_CORE_ALERT}'
          value: '1'
          description: 'Set to 0 to suppress per-core CPU utilization alerts globally.'
        - macro: '{$ENABLE_IF_ERROR_ALERT}'
          value: '1'
          description: 'Set to 0 to suppress interface error rate alerts. Supports context: {$ENABLE_IF_ERROR_ALERT:"em0"}'
        - macro: '{$ENABLE_IF_UTIL_ALERT}'
          value: '1'
          description: 'Set to 0 to suppress interface utilization alerts. Supports context: {$ENABLE_IF_UTIL_ALERT:"em0"}'
        - macro: '{$ENABLE_LINK_DOWN_ALERT}'
          value: '1'
          description: 'Set to 0 to suppress interface link down alerts. Supports context macros for per-interface control: {$ENABLE_LINK_DOWN_ALERT:"em0"}'
        - macro: '{$ENABLE_PF_BLOCK_ALERT}'
          value: '1'
          description: 'Set to 0 to suppress pf interface block rate alerts. Supports context: {$ENABLE_PF_BLOCK_ALERT:"em0"}'
        - macro: '{$ENABLE_PF_TABLE_ALERT}'
          value: '0'
          description: 'Default 0 — only known dynamic blocklists are alerted. Set to 1 per table via context macro: {$ENABLE_PF_TABLE_ALERT:"sshguard"}'
        - macro: '{$ENABLE_PF_TABLE_ALERT:"snort2c"}'
          value: '1'
          description: 'Enable entry count alert for snort2c table'
        - macro: '{$ENABLE_PF_TABLE_ALERT:"sshguard"}'
          value: '1'
          description: 'Enable entry count alert for sshguard table'
        - macro: '{$ENABLE_PF_TABLE_ALERT:"sshlockout"}'
          value: '1'
          description: 'Enable entry count alert for sshlockout table'
        - macro: '{$ENABLE_PF_TABLE_ALERT:"virusprot"}'
          value: '1'
          description: 'Enable entry count alert for virusprot table'
        - macro: '{$ENABLE_STORAGE_ALERT}'
          value: '1'
          description: 'Set to 0 to suppress storage utilization alerts globally.'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Warning threshold for interface errors per second'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
          description: 'Warning threshold for interface utilization (%)'
        - macro: '{$LOAD.AVG.WARN}'
          value: '4'
          description: 'Warning threshold for system load average (5-minute)'
        - macro: '{$MEMORY.SWAP.WARN}'
          value: '80'
          description: 'Warning threshold for swap utilization (%)'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Warning threshold for memory utilization (%)'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^.*$'
          description: 'Regex: only discover interfaces matching this pattern'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '^(pflog|pfsync|enc|lo)\d*$'
          description: 'Regex: exclude internal pfSense interfaces from discovery'
        - macro: '{$PF.IF.BLOCK.WARN}'
          value: '100'
          description: 'Warning threshold for pf blocked packets per second per interface'
        - macro: '{$PF.STATE.UTIL.CRIT}'
          value: '90'
          description: 'Critical threshold for pf state table utilization (%)'
        - macro: '{$PF.STATE.UTIL.WARN}'
          value: '80'
          description: 'Warning threshold for pf state table utilization (%)'
        - macro: '{$PF.TABLE.COUNT.WARN}'
          value: '100'
          description: 'Warning threshold for pf table entry count (sshguard/snort2c blocked IPs)'
        - macro: '{$PFSENSE.VERSION.EXPECTED}'
          value: 2.8.1
          description: 'Expected pfSense CE version. Update this macro when a new release is available to trigger an alert on outdated hosts.'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
          description: 'SNMP v2c community string'
        - macro: '{$STORAGE.UTIL.CRIT}'
          value: '90'
          description: 'Critical threshold for storage utilization (%)'
        - macro: '{$STORAGE.UTIL.WARN}'
          value: '80'
          description: 'Warning threshold for storage utilization (%)'
        - macro: '{$TCP.ESTAB.MAX}'
          value: '10000'
          description: 'Max allowed TCP established connections before warning'
