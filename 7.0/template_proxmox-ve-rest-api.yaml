zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 4c76bf44638d4eb58b3c626059abae32
      template: 'pfSense by SNMP'
      name: 'pfSense by SNMP'
      description: 'Zabbix template for monitoring pfSense firewalls via SNMP (bsnmpd). No Zabbix agent required. Created by Thomas Rzen. https://github.com/Garfieldttt/Zabbix-Template-pfSense-SNMP'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 82ebbf2d4ac74bf8b1b7fcaa3f0f1b54
          name: 'IP: Forwarded datagrams rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.4.6.0]'
          key: ip.forw.datagrams.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'ipForwDatagrams — IP datagrams forwarded per second (routing traffic through pfSense).'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: network
        - uuid: b067b2323db94099b10f2c1e4ec5e199
          name: 'IP: Inbound discards rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.4.8.0]'
          key: ip.in.discards.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'ipInDiscards — inbound IP datagrams discarded per second despite no errors (e.g. buffer overflow).'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 1ee7ab8f8c7d4c71a99963419eee1966
              expression: 'avg(/pfSense by SNMP/ip.in.discards.rate,5m)>0'
              name: 'pfSense: IP inbound datagrams being discarded'
              opdata: 'Rate: {ITEM.LASTVALUE1}/s'
              priority: WARNING
              description: 'IP datagrams are being discarded on inbound. May indicate buffer overflow or resource exhaustion.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 3449a90610f844ec941d44d332761b7f
          name: 'pf: Bad offset packets rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.2.2.0]'
          key: pf.counter.badoffset.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfCounterBadOffset — malformed packets with bad offset per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: f1e5b0ba99e84edf9f1ddb1e205d33a2
              expression: 'avg(/pfSense by SNMP/pf.counter.badoffset.rate,5m)>0'
              name: 'pfSense: Malformed packets detected (bad offset)'
              priority: WARNING
              description: 'pf is receiving malformed packets with bad offset. May indicate network issues or a scan/attack.'
              tags:
                - tag: scope
                  value: security
        - uuid: 32cc1a5961fe46bbaade632536458388
          name: 'pf: Fragmented packets rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.2.3.0]'
          key: pf.counter.fragment.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfCounterFragment — fragmented packets per second processed by pf.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: d6501a8fe47b4a2ab33256997a47a563
          name: 'pf: Rule-matched packets rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.2.1.0]'
          key: pf.counter.match.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfCounterMatch — packets per second that matched any pf rule.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 088fe790210e4d29b646a897040533ba
          name: 'pf: Memory drops'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.2.6.0]'
          key: pf.counter.memdrop.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfCounterMemDrop — packets dropped per second due to memory limits.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: 877b9d1d4ce34459821dff33b31c7b94
              expression: 'min(/pfSense by SNMP/pf.counter.memdrop.rate,5m)>0'
              name: 'pfSense: pf dropping packets due to memory limits'
              opdata: 'Rate: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'pf is discarding packets because memory limits are reached. Check state table size and system RAM.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: f84dc194ea2e43a194ac43e1a2c81324
          name: 'pf: Normalized packets rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.2.5.0]'
          key: pf.counter.normalize.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfCounterNormalize — packets normalized (scrubbed) per second by pf.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 2b6c0b3178684396b42fc71330272dc4
          name: 'pf: Short packets rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.2.4.0]'
          key: pf.counter.short.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfCounterShort — packets too short for their IP header per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 34dd507b093f465e8889d7b3516d4214
          name: 'pf: IPv4 inbound packets dropped'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.7.5.0]'
          key: pf.log.ip4.in.drop.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfLogInterfaceIp4PktsInDrop — IPv4 inbound packets dropped by pf rules per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: 69d43a58cb214979a220200a9f3c6bf7
              expression: 'avg(/pfSense by SNMP/pf.log.ip4.in.drop.rate,5m)>100'
              name: 'pfSense: High inbound packet drop rate'
              opdata: 'Dropped/s: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'pf is dropping more than 100 packets/s inbound. Possible DDoS or misconfigured rule.'
              tags:
                - tag: scope
                  value: security
        - uuid: 05bea1c260b340b09e2636e3a04353c4
          name: 'pf: IPv4 inbound packets passed'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.7.4.0]'
          key: pf.log.ip4.in.pass.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfLogInterfaceIp4PktsInPass — IPv4 inbound packets passed by pf rules per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 4d6e284c25214ec8901ef62da7803de1
          name: 'pf: IPv4 outbound packets dropped'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.7.7.0]'
          key: pf.log.ip4.out.drop.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfLogInterfaceIp4PktsOutDrop — IPv4 outbound packets dropped by pf rules per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 414b6530d50a4d7aad53a707d5ca0c54
          name: 'pf: IPv4 outbound packets passed'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.7.6.0]'
          key: pf.log.ip4.out.pass.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: pps
          description: 'pfLogInterfaceIp4PktsOutPass — IPv4 outbound packets passed by pf rules per second.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 1084c7dc233c421ebd95f8a17140285e
          name: 'pf: Firewall running'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.1.1.0]'
          key: pf.running
          delay: '60'
          history: 1w
          description: 'pfRunning — whether the pf packet filter is active. 1=running, 2=stopped.'
          valuemap:
            name: 'pfSense pf status'
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: 2631ce49d77c43bca3614410ae1ea94d
              expression: 'last(/pfSense by SNMP/pf.running)<>1'
              name: 'pfSense: pf firewall is not running'
              priority: DISASTER
              description: 'The pf packet filter is stopped. Firewall protection is inactive.'
              tags:
                - tag: scope
                  value: availability
        - uuid: f4682debb07b4a3f99c0d1aa41a0ee04
          name: 'pf: Source nodes'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.4.1.0]'
          key: pf.src.nodes
          delay: '60'
          history: 1w
          description: 'pfSrcNodes — number of tracked source nodes (used for sticky-address and source-hash rules).'
          tags:
            - tag: component
              value: firewall
        - uuid: c4585f8501dd420b890059d7b079d924
          name: 'pf: State table current entries'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.3.1.0]'
          key: pf.states.current
          delay: '60'
          history: 1w
          description: 'pfStateCount — current number of entries in the pf state table.'
          tags:
            - tag: component
              value: firewall
        - uuid: a259f7599ea3436aaba24f0e8a10b71d
          name: 'pf: New connections rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.3.3.0]'
          key: pf.states.inserts.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: cps
          description: 'pfStateTableInserts — new states created per second (new connections).'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 27d35593a5c44a7ea80f6ea3a0f7fa98
          name: 'pf: State table maximum entries'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.5.1.0]'
          key: pf.states.limit
          delay: 1h
          history: 1w
          description: 'pfStateLimit — maximum allowed entries in the pf state table.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: firewall
        - uuid: 6941634c2909456bb17b3765558dd6f2
          name: 'pf: Closed connections rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.12325.1.200.1.3.4.0]'
          key: pf.states.removals.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: cps
          description: 'pfStateTableRemovals — states removed per second (closed connections).'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: firewall
        - uuid: 044ce380d6b3424a95c2f2a90c2e42ce
          name: 'pf: State table utilization'
          type: CALCULATED
          key: pf.states.util
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          params: 'last(/{HOST.HOST}/pf.states.current) / last(/{HOST.HOST}/pf.states.limit) * 100'
          description: 'Calculated percentage of pf state table in use.'
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: 4ee21df965934061b5cdd3c7562b3051
              expression: 'last(/pfSense by SNMP/pf.states.util)>{$PF.STATE.UTIL.CRIT}'
              name: 'pfSense: pf state table critically full'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'pf state table utilization exceeds {$PF.STATE.UTIL.CRIT}%. New connections may be dropped.'
              tags:
                - tag: scope
                  value: capacity
            - uuid: 148af7a79b994f1daf1fbeab59a5cbf2
              expression: 'last(/pfSense by SNMP/pf.states.util)>{$PF.STATE.UTIL.WARN}'
              name: 'pfSense: pf state table high utilization'
              opdata: 'Used: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              dependencies:
                - name: 'pfSense: pf state table critically full'
                  expression: 'last(/pfSense by SNMP/pf.states.util)>{$PF.STATE.UTIL.CRIT}'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 5111b5c8245e4b4194370a2424a779d2
          name: 'System version (installed)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: pfsense.version
          delay: 1h
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'pfSense version extracted from sysDescr (1.3.6.1.2.1.1.1.0), e.g. "2.8.1".'
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+\.\d+\.\d+)-\w*RELEASE'
                - \1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 49461e7a69c343f79a6fba65b24bb911
          name: 'System version (available)'
          type: HTTP_AGENT
          key: pfsense.version.available
          delay: 1d
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'Latest pfSense CE release version from docs.netgate.com/pfsense/en/latest/releases/. Checks daily.'
          preprocessing:
            - type: REGEX
              parameters:
                - (2\.\d+\.\d+)
                - \1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 7d
          url: 'https://docs.netgate.com/pfsense/en/latest/releases/index.html'
          tags:
            - tag: component
              value: system
        - uuid: 2941a07e17054a208af8c8f5c0e22cbf
          name: 'System contact'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.4.0]'
          key: system.contact
          delay: 1h
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'sysContact — administrator contact info.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: f9834d2208ed45df9282fb546f9cd2dc
          name: 'CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.11.11.0]'
          key: system.cpu.util
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: '%'
          description: 'ssCpuIdle (UCD-SNMP) — aggregate CPU idle percentage across all cores, converted to utilization (100 - idle).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return 100 - value;'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: acc7e013012449cd9ff951a125ee1a4c
              expression: 'min(/pfSense by SNMP/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              name: 'pfSense: CPU utilization is critically high'
              opdata: 'CPU: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'CPU utilization has been above {$CPU.UTIL.CRIT}% for 5 minutes.'
              tags:
                - tag: scope
                  value: performance
            - uuid: 4d4e7af9f2f74723b0acdbf2da4f1361
              expression: 'min(/pfSense by SNMP/system.cpu.util,5m)>{$CPU.UTIL.WARN}'
              name: 'pfSense: High CPU utilization'
              opdata: 'CPU: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'CPU utilization has been above {$CPU.UTIL.WARN}% for 5 minutes.'
              dependencies:
                - name: 'pfSense: CPU utilization is critically high'
                  expression: 'min(/pfSense by SNMP/system.cpu.util,5m)>{$CPU.UTIL.CRIT}'
              tags:
                - tag: scope
                  value: performance
        - uuid: 5a131ae12b0644718aa722adbe092b9c
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.1.0]'
          key: system.descr
          delay: 1h
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'sysDescr — OS version and hardware info.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 0fe15b7654ea44ecace6464589b2eb5a
              expression: 'last(/pfSense by SNMP/system.descr,#1)<>last(/pfSense by SNMP/system.descr,#2)'
              name: 'pfSense: System version has changed'
              priority: INFO
              description: 'sysDescr changed — a pfSense update may have been applied. Verify the new version.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 1def021a4c9c43aaacb9a00cfb194334
          name: 'System hostname'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.5.0]'
          key: system.hostname
          delay: 1h
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'sysName — configured hostname.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: 51a5c127fe7c4c3aa0b34d09c30070f1
          name: 'IP forwarding'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.4.1.0]'
          key: system.ipforward
          delay: '60'
          history: 1w
          description: 'ipForwarding (MIB-II) — whether this system is acting as an IP router. 1=forwarding, 2=notForwarding.'
          valuemap:
            name: 'pfSense IP forwarding'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: f6a22c68427748d191becd3081a2af59
              expression: 'last(/pfSense by SNMP/system.ipforward)<>1'
              name: 'pfSense: IP forwarding is disabled'
              priority: DISASTER
              description: 'IP forwarding (routing) is not enabled. pfSense cannot forward packets between interfaces.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: d1b0e0be552d4b52b8d69fb1088ddf23
          name: 'System load average (1 min)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.10.1.5.1]'
          key: system.load.avg1
          delay: '60'
          history: 1w
          value_type: FLOAT
          description: 'laLoadInt — 1-minute load average × 100. Divided by 100 to get actual value.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: cpu
        - uuid: 49d09c10f81e440b9d1fca77e59c9fc6
          name: 'System load average (5 min)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.10.1.5.2]'
          key: system.load.avg5
          delay: '60'
          history: 1w
          value_type: FLOAT
          description: 'laLoadInt — 5-minute load average × 100. Divided by 100 to get actual value.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 407c1bdf2e064dd0ae1a45994e16ee60
              expression: 'avg(/pfSense by SNMP/system.load.avg5,15m)>{$LOAD.AVG.WARN}'
              name: 'pfSense: High system load average'
              priority: WARNING
              description: '5-minute load average has been above {$LOAD.AVG.WARN} for 15 minutes.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 8c09db290ebe4f0a8026cd3fb70b7f56
          name: 'System load average (15 min)'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.4.1.2021.10.1.5.3]'
          key: system.load.avg15
          delay: '60'
          history: 1w
          value_type: FLOAT
          description: 'laLoadInt — 15-minute load average × 100. Divided by 100 to get actual value.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: cpu
        - uuid: 9b5c84159a1e44cbaa5cad0b21a6edce
          name: 'System location'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.6.0]'
          key: system.location
          delay: 1h
          history: 1w
          value_type: CHAR
          trends: '0'
          description: 'sysLocation — configured physical location.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: ea57ba79420c42c7ac0ea91685d4d0c4
          name: 'Running processes'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.25.1.6.0]'
          key: system.processes.num
          delay: '60'
          history: 1w
          description: 'hrSystemProcesses — number of running processes.'
          tags:
            - tag: component
              value: system
        - uuid: 29c97f2aa0d04c02aaa61ddcd6004fe9
          name: 'System uptime'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.1.3.0]'
          key: system.uptime
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: uptime
          description: 'sysUpTime — time since last reboot (hundredths of seconds, converted to seconds).'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 6ed3b52884f54e4d95b965da54d77bc8
              expression: 'last(/pfSense by SNMP/system.uptime)<600'
              name: 'pfSense: Device has been restarted'
              priority: WARNING
              description: 'Uptime is less than 10 minutes — device recently rebooted.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 4ef65866f7fc495c8aebf2b65b2d98af
          name: 'TCP: Connection attempt failures rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.6.7.0]'
