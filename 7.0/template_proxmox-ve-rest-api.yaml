      valuemaps:
        - uuid: 52cb33702153442d86b827c5fdae460e
          name: 'IF-MIB::ifAdminStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
        - uuid: e7edf8f9c13e494d9c902095d5f513cf
          name: 'IF-MIB::ifOperStatus'
          mappings:
            - value: '1'
              newvalue: up
            - value: '2'
              newvalue: down
            - value: '3'
              newvalue: testing
            - value: '4'
              newvalue: unknown
            - value: '5'
              newvalue: dormant
            - value: '6'
              newvalue: notPresent
            - value: '7'
              newvalue: lowerLayerDown
        - uuid: 6ba7d28c2849449688219996aab566a2
          name: 'pfSense IP forwarding'
          mappings:
            - value: '1'
              newvalue: forwarding
            - value: '2'
              newvalue: notForwarding
            - type: DEFAULT
              newvalue: unknown
        - uuid: 2398a6377d204c638a631051d7610925
          name: 'pfSense pf status'
          mappings:
            - value: '1'
              newvalue: running
            - value: '2'
              newvalue: stopped
            - type: DEFAULT
              newvalue: unknown
        - uuid: 0462991ea5454ca1ba88314f51f41738
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
  triggers:
    - uuid: 95b771391fe64b6ea592661ca7c87915
      expression: 'last(/pfSense by SNMP/pfsense.version)<>last(/pfSense by SNMP/pfsense.version.available) and last(/pfSense by SNMP/pfsense.version.available)<>""'
      name: 'pfSense: Update available (installed: {ITEM.LASTVALUE}, latest: {?last(/pfSense by SNMP/pfsense.version.available)})'
      priority: INFO
      description: 'Installed pfSense version differs from latest release on docs.netgate.com.'
      manual_close: 'YES'
      tags:
        - tag: scope
          value: notice
