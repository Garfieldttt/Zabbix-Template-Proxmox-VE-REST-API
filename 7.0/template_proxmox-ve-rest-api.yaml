        - uuid: 6680a217013e4d0598c79670aafa1704
          name: 'TCP: Retransmit rate'
          type: SNMP_AGENT
          snmp_oid: 'get[1.3.6.1.2.1.6.12.0]'
          key: tcp.retrans.rate
          delay: '60'
          history: 1w
          value_type: FLOAT
          units: ps
          description: 'tcpRetransSegs — TCP segments retransmitted per second. High values indicate network issues.'
