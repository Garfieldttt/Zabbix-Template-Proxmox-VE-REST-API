              parameters:
                - ''
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 417505e936594ec79a89f2f73076b112
              expression: 'avg(/pfSense by SNMP/tcp.attempt.fails.rate,5m)>50'
              name: 'pfSense: High TCP connection failure rate'
              opdata: 'Rate: {ITEM.LASTVALUE1}/s'
              priority: WARNING
              description: 'TCP connection attempt failure rate is high. May indicate a port scan or SYN flood attack.'
